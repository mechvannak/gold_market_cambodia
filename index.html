<script>
// <core>
// Pure logic. Kept free of the DOM so tests can run it in Node and compare it with scripts/decide.py.
const OZ_G = 31.1034768, CHI_G = 3.75, CHI_PER_OZ = OZ_G / CHI_G;
function ozToChi(p) { return p / CHI_PER_OZ; }
function r2(x) { return Math.round(x * 100) / 100; }

function holdings(purchases) {
  let qty = 0, cost = 0, realized = 0;
  const list = [...purchases].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || ((a.id || 0) - (b.id || 0)));
  for (const p of list) {
    const chi = +p.chi, price = +p.price;
    if (p.type === 'buy') { qty += chi; cost += chi * price; }
    else {
      const avg = qty > 0 ? cost / qty : price;
      const sold = Math.min(chi, qty);
      realized += sold * (price - avg);
      qty -= sold; cost -= sold * avg;
    }
  }
  qty = Math.round(qty * 1e6) / 1e6;
  return { chi: Math.max(qty, 0), avg_cost: qty > 0 ? cost / qty : 0, invested: qty > 0 ? cost : 0, realized };
}

// First matching rule wins. Mirrors scripts/decide.py (same thresholds).
function decide(m, hold, refChi, monthly) {
  const price = +m.price_oz, ma200 = +m.ma200, high = +m.high3m;
  if (!(price > 0 && ma200 > 0 && high > 0)) throw new Error('market data is incomplete');
  hold = hold || { chi: 0, avg_cost: 0 };
  const above = price / ma200 - 1, fromHigh = 1 - price / high;
  let profit = null;
  if (hold.chi > 0 && hold.avg_cost > 0 && refChi) profit = refChi / hold.avg_cost - 1;
  const core = hold.chi * 0.30, sellable = Math.max(hold.chi - core, 0);
  const out = { rule: 5, action: 'HOLD', buy_chi: +monthly, sell_chi: 0, steps: 1, core_chi: r2(core), above_200: above, from_high: fromHigh, profit };
  if (profit !== null && profit >= 0.50 && above >= 0.20) Object.assign(out, { rule: 1, action: 'SELL_STEPS', buy_chi: 0, steps: 3, sell_chi: sellable / 3 });
  else if (above >= 0.25) Object.assign(out, { rule: 2, action: 'REDUCE', buy_chi: 0, sell_chi: Math.min(hold.chi * 0.15, sellable) });
  else if (above >= 0.15) Object.assign(out, { rule: 3, action: 'WAIT', buy_chi: monthly * 0.5 });
  else if (price < ma200) Object.assign(out, { rule: 4, action: 'BUY_STEPS', buy_chi: monthly * 2, steps: 3 });
  else if (fromHigh >= 0.08) Object.assign(out, { rule: 4, action: 'BUY_EXTRA', buy_chi: monthly * 1.5, steps: 2 });
  out.buy_chi = r2(out.buy_chi); out.sell_chi = r2(out.sell_chi);
  return out;
}

function b64ToBytes(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

// data/private.enc: {"v":1,"kdf":"PBKDF2-SHA256","iter":N,"salt":b64,"iv":b64,"ct":b64}; ct = AES-256-GCM ciphertext + tag
async function decryptVault(pass, text) {
  const box = JSON.parse(text);
  if (box.v !== 1 || box.kdf !== 'PBKDF2-SHA256') throw new Error('unsupported vault format');
  const iter = +box.iter;
  if (!(iter >= 100000 && iter <= 5000000)) throw new Error('unsupported vault format');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(box.salt), iterations: iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(box.iv) }, key, b64ToBytes(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
// </core>
</script>

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/); const head = lines.shift().split(',');
  const di = head.indexOf('date'), ci = head.indexOf('close');
  if (di < 0 || ci < 0) return [];
  const rows = lines.map((l) => { const c = l.split(','); return { date: c[di], close: parseFloat(c[ci]) }; }).filter((r) => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(r.close));
  rows.sort((a, b) => (a.date < b.date ? -1 : 1));
  let sum = 0;
  rows.forEach((r, i) => { sum += r.close; if (i >= 200) sum -= rows[i - 200].close; r.ma = i >= 199 ? sum / 200 : null; });
  return rows;
}

    HOLD: [`Buy the normal ${c.b} chi this month; otherwise hold.`, `ទិញតាមធម្មតា ${c.b} ជីក្នុងខែនេះ បើមិនដូច្នោះទេ រក្សាទុក។`],
  };
  if (d.action === 'REDUCE' && d.sell_chi === 0) return L(['Do not buy now. If you hold gold, consider selling a little; keep your core.', 'កុំទិញឥឡូវនេះ។ បើអ្នកមានមាស អាចពិចារណាលក់បន្តិច ហើយរក្សាស្នូល។']);
  return L(P[d.action]);
}
function ruleKey(d, m) { return d.rule === 4 ? (+m.price_oz < +m.ma200 ? '4a' : '4b') : d.rule; }

function decisionCard(titleKey, d, m, soften) {
  const lab = L(LABEL[d.action]);
  const cls = KIND_CLASS[d.action];
  let dd = d;
  if (soften) dd = Object.assign({}, d, { buy_chi: r2(d.buy_chi * 0.5), sell_chi: r2(d.sell_chi * 0.5) });
  return `<div class="card"><h2>${esc(t(titleKey))}</h2>
    <div class="decision"><div class="label">${esc(lab)}</div><span class="badge ${cls}">${d.rule === 4 ? '4' : d.rule}</span></div>
    <div class="why">${esc(L(RULE_WHY[ruleKey(d, m)]))}</div>
    <div class="plan"><b>${esc(t('plan'))}:</b> ${esc(planText(dd))}</div>
    ${soften ? `<div class="warn">${esc(t('soft'))}</div>` : ''}
    ${analysisFresh() ? '' : `<div class="note">${esc(t('stale'))}</div>`}</div>`;
}

/* ---------- views ---------- */
function scaleHTML(label, value, lo, hi, zones, ticks) {
  const span = hi - lo, clamp = Math.max(lo, Math.min(hi, value));
  const zs = zones.map(([a, b, c]) => `<i class="z-${c}" style="width:${((b - a) / span) * 100}%"></i>`).join('');
  return `<div class="scale"><div class="row"><span>${esc(label)}</span><b class="${signCls(value)}">${pct(value)}</b></div>
    <div class="track">${zs}</div><div class="marker"><span style="left:${((clamp - lo) / span) * 100}%"></span></div>
    <div class="ticks">${ticks.map((x) => `<span style="left:${((x - lo) / span) * 100}%;transform:translateX(${x <= lo ? '0' : x >= hi ? '-100%' : '-50%'})">${x > 0 ? '+' : ''}${x}%</span>`).join('')}</div></div>`;
}

/* ---------- chart ---------- */
function chartRows() {
  const H = state.hist; if (!H.length) return [];
  const last = H[H.length - 1].date; let from, to = last;
  if (state.range === 'custom') { from = state.from || addDays(last, -90); to = state.to || last; }
  else from = addDays(last, -({ '1W': 7, '1M': 30, '3M': 91, '6M': 182, '1Y': 365 }[state.range] || 91));
  let rows = H.filter((r) => r.date >= from && r.date <= to);
  if (state.bars === 'weekly') {
    const g = new Map();
    for (const r of rows) {
      const d = new Date(r.date + 'T00:00:00Z'); const key = addDays(r.date, -((d.getUTCDay() + 6) % 7));
      g.set(key, r); // last trading day of the week wins
    }
    rows = [...g.values()];
  }
  return rows;
}
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((x) => x >= raw) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
  return out;
}
function drawChart() {
  const box = $('#chartBox'); if (!box) return;
  const rows = chartRows();
  if (rows.length < 2) { box.innerHTML = `<div class="empty">${esc(t('no_hist'))}</div>`; $('#chartStats').innerHTML = ''; return; }
  const W = Math.max(box.clientWidth, 280), H = 260, pl = 46, pr = 8, pt = 8, pb = 22;
  const vals = rows.flatMap((r) => (r.ma ? [r.close, r.ma] : [r.close]));
  let lo = Math.min(...vals), hi = Math.max(...vals); const padv = (hi - lo) * 0.06 || 1; lo -= padv; hi += padv;
  const X = (i) => pl + i * ((W - pl - pr) / rows.length), BW = (W - pl - pr) / rows.length;
  const Y = (v) => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb), base = H - pb;
  const bw = Math.max(BW * (BW > 6 ? 0.72 : 0.9), 0.8);
  const ticks = niceTicks(lo, hi, 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('chart_unit'))}">`;
  ticks.forEach((v) => { s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${Math.round(v).toLocaleString('en-US')}</text>`; });
  rows.forEach((r, i) => { s += `<rect class="bar" data-i="${i}" x="${(X(i) + (BW - bw) / 2).toFixed(2)}" y="${Y(r.close).toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(base - Y(r.close), 0.5).toFixed(2)}" rx="${bw > 4 ? 2 : 0}" fill="var(--bar)" opacity="${i === rows.length - 1 ? 1 : 0.82}"/>`; });
  const maPts = rows.map((r, i) => (r.ma ? `${(X(i) + BW / 2).toFixed(1)},${Y(r.ma).toFixed(1)}` : null)).filter(Boolean);
  if (maPts.length > 1) s += `<polyline points="${maPts.join(' ')}" fill="none" stroke="var(--ma)" stroke-width="2" stroke-linejoin="round"/>`;
  const nl = Math.min(4, rows.length);
  for (let k = 0; k < nl; k++) { const i = Math.round((k * (rows.length - 1)) / Math.max(nl - 1, 1)); s += `<text x="${Math.min(Math.max(X(i) + BW / 2, pl + 14), W - pr - 14)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${shortDate(rows[i].date)}</text>`; }
  s += `<line id="cross" y1="${pt}" y2="${base}" stroke="var(--text)" stroke-width="1" stroke-dasharray="3 3" opacity="0" /></svg><div id="tip"></div>`;
  box.innerHTML = s + `<div class="legend"><span><i style="background:var(--bar)"></i>${esc(t('price_'))}</span>${maPts.length > 1 ? `<span><i style="background:var(--ma)"></i>${esc(t('ma200'))}</span>` : ''}</div>`;

  const svg = box.querySelector('svg'), tip = $('#tip'), cross = $('#cross');
  const show = (ev) => {
    const rect = svg.getBoundingClientRect(), x = (ev.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.floor((x - pl) / BW))); const r = rows[i], prev = rows[i - 1];
    const cx = X(i) + BW / 2; cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '0.6');
    box.querySelectorAll('.bar').forEach((b) => b.setAttribute('fill', +b.dataset.i === i ? 'var(--bar-hi)' : 'var(--bar)'));
    let html = `<b>${money2(r.close)}</b><br>${esc(r.date)}`;
    if (prev) { const c = (r.close / prev.close - 1) * 100; html += `<br>${esc(state.bars === 'weekly' ? t('w1') : t('d1'))}: ${pct(c, 2)}`; }
    if (r.ma) html += `<br>${esc(t('ma200'))}: ${pct((r.close / r.ma - 1) * 100)}`;
    tip.innerHTML = html; tip.style.display = 'block';
    const px = cx * (rect.width / W), tw = tip.offsetWidth;
    tip.style.left = Math.max(2, Math.min(px - tw / 2, rect.width - tw - 2)) + 'px'; tip.style.top = '2px';
  };
  const hide = () => { tip.style.display = 'none'; cross.setAttribute('opacity', '0'); box.querySelectorAll('.bar').forEach((b) => b.setAttribute('fill', 'var(--bar)')); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);

  const first = rows[0].close, lastc = rows[rows.length - 1].close, closes = rows.map((r) => r.close);
  $('#chartStats').innerHTML = `<div class="stats"><div>${esc(t('change'))}<b class="${signCls(lastc - first)}">${pct((lastc / first - 1) * 100)}</b></div><div>${esc(t('high_'))}<b>${money2(Math.max(...closes))}</b></div><div>${esc(t('low_'))}<b>${money2(Math.min(...closes))}</b></div></div>`;
}
function bindChartInputs() {
  const f = $('#cFrom'), to = $('#cTo');
  const upd = () => { if (f.value && to.value && f.value <= to.value) { state.from = f.value; state.to = to.value; drawChart(); } };
  if (f) f.addEventListener('change', upd); if (to) to.addEventListener('change', upd);
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab === 'chart') drawChart(); }, 120); });

/* ---------- messages, sheet ---------- */
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 2600); }
function setMsg(id, msg, ok) { const el = $('#' + id); if (el) { el.textContent = msg || ''; el.className = 'msg' + (ok ? ' ok' : ''); } }
function canSend() { return !!(tg && tg.initData && tg.initDataUnsafe && !tg.initDataUnsafe.query_id && typeof tg.sendData === 'function'); }
function openSheet(text) {
  $('#sheetBox').innerHTML = `<h3 style="margin:0 0 4px">${esc(t('copy_title'))}</h3><div class="note" style="margin-top:0">${esc(t('copy_hint'))}</div><code id="cmdText">${esc(text)}</code>
    <button class="btn" data-act="copyCmd">${esc(t('copy'))}</button><button class="btn ghost" data-act="closeSheet">${esc(t('close'))}</button>`;
  $('#sheet').classList.add('show'); $('#sheet').dataset.text = text;
}
function sendCmds(lines) {
  const data = lines.join('\n');
  if (data.length > 3500) { toast('Too long'); return; }
  if (canSend()) { try { tg.sendData(data); return; } catch (e) { /* fall through to copy sheet */ } }
  openSheet(data);
}
const posNum = (id) => { const el = $('#' + id); const x = el ? parseFloat(el.value) : NaN; return isFinite(x) && x > 0 ? x : null; };

/* ---------- biometrics (Telegram BiometricManager) ---------- */
const BM = tg && tg.BiometricManager;
function bmInit() {
  return new Promise((res) => {
    try {
      if (!BM || (tg.isVersionAtLeast && !tg.isVersionAtLeast('7.2'))) return res(false);
      const done = () => { state.bio = { available: !!BM.isBiometricAvailable, saved: !!BM.isBiometricTokenSaved }; res(state.bio.available); };
      if (BM.isInited) done(); else BM.init(done);
    } catch (e) { res(false); }
  });
}
function bmAccess() { return new Promise((res) => { try { if (BM.isAccessGranted) res(true); else BM.requestAccess({ reason: t('bio_reason') }, (g) => res(!!g)); } catch (e) { res(false); } }); }
async function bmAuth() { if (!(await bmAccess())) return null; return new Promise((res) => { try { BM.authenticate({ reason: t('bio_reason') }, (ok, token) => res(ok && token ? token : null)); } catch (e) { res(null); } }); }
async function bmSave(token) { if (!(await bmAccess())) return false; return new Promise((res) => { try { BM.updateBiometricToken(token, (ok) => { state.bio.saved = !!ok && !!token; res(!!ok); }); } catch (e) { res(false); } }); }

/* ---------- unlock ---------- */
async function unlockWith(pass) {
  setMsg('lockMsg', '…', true);
  let text;
  try {
    const r = await fetch('data/private.enc?t=' + Date.now(), { cache: 'no-store' });
    if (r.status === 404) { setMsg('lockMsg', t('no_vault')); return false; }
    if (!r.ok) throw new Error('http');
    text = await r.text();
  } catch (e) { setMsg('lockMsg', t('load_error')); return false; }
  try {
    state.vault = normalizeVault(await decryptVault(pass, text)); state.pass = pass;
    const l = state.vault.settings.lang; if (l === 'en' || l === 'km') { state.lang = l; }
    render(); return true;
  } catch (e) {
    setMsg('lockMsg', e && e.name === 'OperationError' ? t('wrong_pass') : t('load_error')); return false;
  }
}

/* ---------- actions ---------- */
let side = 'buy';
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const v = el.dataset.v, act = el.dataset.act;
  switch (act) {
    case 'tab': state.tab = v; render(); break;
    case 'lang': state.lang = v; try { localStorage.setItem('gc_lang', v); } catch (x) {} render(); break;
    case 'range': state.range = v; if (v === 'custom' && !state.to && state.hist.length) { state.to = state.hist[state.hist.length - 1].date; state.from = addDays(state.to, -90); } render(); break;
    case 'bars': state.bars = v; render(); break;
    case 'unlock': { const p = $('#pass'); if (p && p.value) { el.disabled = true; const ok = await unlockWith(p.value); if (!ok) el.disabled = false; } break; }
    case 'bioUnlock': { const tok = await bmAuth(); if (tok) await unlockWith(tok); else setMsg('lockMsg', t('wrong_pass')); break; }
    case 'bioOn': { const ok = await bmSave(state.pass); if (ok) { render(); toast(t('bio_on')); } break; }
    case 'bioOff': { await bmSave(''); state.bio.saved = false; render(); toast(t('bio_off')); break; }
    case 'lockNow': state.vault = null; state.pass = ''; render(); break;
    case 'side': side = v; $('#tBuy').classList.toggle('on', v === 'buy'); $('#tSell').classList.toggle('on', v === 'sell'); break;
    case 'sendTrade': {
      const chi = posNum('fChi'), price = posNum('fPrice'), date = $('#fDate').value;
      if (!chi || !price) return setMsg('tradeMsg', t('bad_num'));
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > todayPP()) return setMsg('tradeMsg', t('bad_date'));
      if (side === 'sell' && chi > holdings(state.vault.purchases).chi + 1e-9) return setMsg('tradeMsg', t('sell_more'));
      setMsg('tradeMsg', t('sent_note'), true); sendCmds([`/${side} ${num(chi)} ${num(price)} ${date}`]); break;
    }
    case 'sendShop': {
      const s = posNum('fShopS'), b = posNum('fShopB');
      if (!s || !b) return setMsg('shopMsg', t('bad_num'));
      if (b > s) return setMsg('shopMsg', t('bb_high'));
      setMsg('shopMsg', t('sent_note'), true); sendCmds([`/shop ${num(s)} ${num(b)}`]); break;
    }
    case 'sendSettings': {
      const s = state.vault.settings, cmds = [];
      const hour = parseInt($('#sHour').value, 10), lang = $('#sLang').value, mo = posNum('sMonthly');
      if (hour !== +s.hour) cmds.push(`/time ${hour}`);
      if (lang !== s.lang) cmds.push(`/lang ${lang}`);
      if (mo && mo !== +s.monthly_chi) cmds.push(`/monthly ${num(mo)}`);
      [['weekly', 'nWeekly'], ['monthly', 'nMonthly'], ['watchdog', 'nWatch']].forEach(([k, id]) => { if ($('#' + id).checked !== !!s.notify[k]) cmds.push(`/notify ${k} ${$('#' + id).checked ? 'on' : 'off'}`); });
      if (!cmds.length) return setMsg('setMsg', t('no_change'));
      setMsg('setMsg', t('sent_note'), true); sendCmds(cmds); break;
    }
    case 'sendAlert': {
      const lvl = posNum('aLevel'); if (!lvl) return setMsg('alMsg', t('bad_num'));
      setMsg('alMsg', t('sent_note'), true); sendCmds([`/alert ${$('#aDir').value} ${num(lvl)}${$('#aUnit').value === 'chi' ? ' chi' : ''}`]); break;
    }
    case 'clearAlerts': sendCmds(['/alert clear']); break;
    case 'copyCmd': { const text = $('#sheet').dataset.text || ''; try { await navigator.clipboard.writeText(text); toast(t('copied')); } catch (x) { const r = document.createRange(); r.selectNodeContents($('#cmdText')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } break; }
    case 'closeSheet': $('#sheet').classList.remove('show'); break;
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target && e.target.id === 'pass') { const b = document.querySelector('[data-act="unlock"]'); if (b) b.click(); } });
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('#sheet').classList.remove('show'); });

/* ---------- start ---------- */
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { if (tg) { tg.setHeaderColor(dark ? '#07202f' : '#0b5a86'); tg.setBackgroundColor(dark ? '#07202f' : '#eaf5fb'); } } catch (e) {}
}
(async function init() {
  if (tg) { try { tg.ready(); tg.expand(); tg.onEvent && tg.onEvent('themeChanged', applyTheme); } catch (e) {}
    const lc = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
    try { if (!localStorage.getItem('gc_lang') && lc === 'en') state.lang = 'en'; } catch (e) { if (lc === 'en') state.lang = 'en'; } }
  applyTheme(); render();
  await Promise.all([loadPublic(), bmInit()]);
  render();
})();
})();
</script>
</body>
